<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover so env(safe-area-inset-*) works (bottom bars clear the home indicator) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TailMe</title>
  <!-- Installable app (Add to Home Screen); lib/theme keeps theme-color in step with dark mode -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f2f4f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TailMe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <div id='app'></div>
</body>
</html>
